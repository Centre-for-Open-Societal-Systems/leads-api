# ==================================
# NGINX -> Jenkins Routing
# ==================================
# Routes /jenkins/* from the NLB to the Jenkins EC2
# via the jenkins-external Service+Endpoints bridge.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-to-jenkins
  namespace: jenkins
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /jenkins
            pathType: Prefix
            backend:
              service:
                name: jenkins-external
                port:
                  number: 8080
