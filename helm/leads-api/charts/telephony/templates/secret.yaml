{{- /*
Chart-owned telephony credentials (secret.create): secret.values from the delivery's values
files, completed at install time by telephony.secretData (DB_PASSWORD from
secret.dbPasswordFrom, ESL_PASSWORD kept or generated). Never from Git.
*/ -}}
{{- if .Values.secret.create }}
{{- $values := include "telephony.secretData" . | fromYaml }}
{{- range $key := list "DB_USER" "DB_PASSWORD" "ESL_PASSWORD" }}
{{- if not (get $values $key) }}
{{- fail (printf "telephony.secret.create: telephony.secret.values.%s is required (secret values file; DB_PASSWORD may come from secret.dbPasswordFrom, ESL_PASSWORD from secret.generateEslPassword)" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telephony.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telephony.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $values }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
