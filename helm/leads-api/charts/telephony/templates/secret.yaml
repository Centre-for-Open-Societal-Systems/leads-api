{{- /*
Chart-owned telephony credentials (secret.create). The values come from the delivery's
secret values file, never from Git.
*/ -}}
{{- if .Values.secret.create }}
{{- $values := .Values.secret.values | default dict }}
{{- range $key := list "DB_USER" "DB_PASSWORD" "ESL_PASSWORD" }}
{{- if not (get $values $key) }}
{{- fail (printf "telephony.secret.create: telephony.secret.values.%s is required (from the secret values file)" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telephony.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telephony.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $values }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
