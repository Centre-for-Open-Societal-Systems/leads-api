# Production overrides - mirrors terra/prod/k8/*
# helm upgrade --install leads-api ./helm/leads-api -f helm/leads-api/values-prod.yaml \
#   --set externalDb.ip=10.0.x.x --set secrets.existingSecret=leads-secrets

image:
  tag: prod-latest

autoUpdate:
  mode: keel

config:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://leads-postgres:5432/leads_db"
  ELASTICSEARCH_HOST: "leads-elasticsearch"
  A2C_WEBHOOK_INITIATE_URL: ""
  A2C_WEBHOOK_INITIATE_ENABLED: "true"

secrets:
  # Created out-of-band (Terraform 00-secrets.yaml.tpl or External Secrets)
  existingSecret: leads-secrets

externalDb:
  enabled: true
  ip: ""   # set via --set externalDb.ip=<db private ip>

kong:
  enabled: true
