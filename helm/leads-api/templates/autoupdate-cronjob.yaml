{{- if eq .Values.autoUpdate.mode "cronjob" }}
{{- $fullname := include "leads-api.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-updater
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-updater
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $fullname | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-updater
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-updater
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-updater
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-updater
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.autoUpdate.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: {{ $fullname }}-updater
          restartPolicy: Never
          containers:
            - name: kubectl
              image: {{ .Values.autoUpdate.cronjob.image }}
              command:
                - kubectl
                - rollout
                - restart
                - deployment/{{ $fullname }}
                - -n
                - {{ .Release.Namespace }}
              resources:
                {{- toYaml .Values.autoUpdate.cronjob.resources | nindent 16 }}
{{- end }}
