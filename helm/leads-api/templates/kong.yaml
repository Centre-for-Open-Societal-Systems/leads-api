{{- if .Values.kong.enabled }}
{{- $fullname := include "leads-api.fullname" . }}
{{- $rl := .Values.kong.rateLimit }}
{{- if $rl.enabled }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $fullname }}-rate-limit
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
config:
  minute: {{ $rl.minute }}
  limit_by: {{ $rl.limitBy }}
  policy: {{ $rl.policy }}
plugin: rate-limiting
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-initiate
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
  annotations:
    konghq.com/plugins: {{ $fullname }}-rate-limit
    konghq.com/strip-path: "false"
spec:
  ingressClassName: {{ .Values.kong.ingressClassName }}
  rules:
    - {{- with .Values.kong.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: {{ $rl.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ .Values.service.port }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-default
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: {{ .Values.kong.ingressClassName }}
  rules:
    - {{- with .Values.kong.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
