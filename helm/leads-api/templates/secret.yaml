{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values.secrets.values }}
{{- $required := list "SPRING_DATASOURCE_USERNAME" "SPRING_DATASOURCE_PASSWORD" "ELASTICSEARCH_USERNAME" "ELASTICSEARCH_PASSWORD" }}
{{- if eq (toString .Values.config.A2C_WEBHOOK_INITIATE_ENABLED) "true" }}
{{- $required = concat $required (list "A2C_WEBHOOK_API_KEY" "A2C_WEBHOOK_API_SECRET") }}
{{- end }}
{{- if .Values.redis.auth.enabled }}
{{- $required = append $required "SPRING_REDIS_PASSWORD" }}
{{- end }}
{{- range $required }}
{{- $_ := required (printf "secrets.values.%s is required (or set secrets.existingSecret)" .) (get $v .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leads-api.secretName" . }}
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $val := $v }}
  {{- if $val }}
  {{ $k }}: {{ $val | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
