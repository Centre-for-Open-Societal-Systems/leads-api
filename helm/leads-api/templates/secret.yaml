{{- if not .Values.secrets.existingSecret }}
{{- $v := deepCopy .Values.secrets.values }}
{{- /* SPRING_DATASOURCE_PASSWORD copied at install time from a Secret in another namespace
(e.g. the shared frappe-common PostgreSQL), so no one keeps a copy of it. Needs `get` on that
one Secret; `helm template` cannot read the cluster, so set the value directly there. */}}
{{- $from := .Values.secrets.datasourcePasswordFrom }}
{{- if and $from.name (not (get $v "SPRING_DATASOURCE_PASSWORD")) }}
{{- $src := lookup "v1" "Secret" $from.namespace $from.name }}
{{- $raw := dig "data" $from.key "" $src }}
{{- if not $raw }}
{{- fail (printf "secrets.datasourcePasswordFrom: cannot read key %q of Secret %s/%s (missing, or the deployer has no get on it)" $from.key $from.namespace $from.name) }}
{{- end }}
{{- $_ := set $v "SPRING_DATASOURCE_PASSWORD" (b64dec $raw) }}
{{- end }}
{{- $required := list "SPRING_DATASOURCE_USERNAME" "SPRING_DATASOURCE_PASSWORD" "ELASTICSEARCH_USERNAME" "ELASTICSEARCH_PASSWORD" }}
{{- if eq (toString .Values.config.A2C_WEBHOOK_INITIATE_ENABLED) "true" }}
{{- $required = concat $required (list "A2C_WEBHOOK_API_KEY" "A2C_WEBHOOK_API_SECRET") }}
{{- end }}
{{- if .Values.redis.auth.enabled }}
{{- $required = append $required "SPRING_REDIS_PASSWORD" }}
{{- end }}
{{- range $required }}
{{- $_ := required (printf "secrets.values.%s is required (or set secrets.existingSecret)" .) (get $v .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leads-api.secretName" . }}
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $val := $v }}
  {{- if $val }}
  {{ $k }}: {{ $val | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
