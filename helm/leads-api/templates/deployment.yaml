apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leads-api.fullname" . }}
  labels:
    {{- include "leads-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "leads-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods whenever config/secret values change on helm upgrade
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "leads-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "leads-api.pullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "leads-api.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dbInit.enabled }}
      {{- $dbs := required "dbInit.databases: list at least one database" .Values.dbInit.databases }}
      initContainers:
        # Creates each database in dbInit.databases on the shared PostgreSQL when it is missing,
        # with the app's own login (SPRING_DATASOURCE_USERNAME/PASSWORD, which must be allowed to
        # CREATE DATABASE). An existing database is left as it is.
        - name: db-init
          image: {{ .Values.dbInit.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: {{ required "dbInit.host is required" .Values.dbInit.host | quote }}
            - name: PGPORT
              value: {{ .Values.dbInit.port | toString | quote }}
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: {{ include "leads-api.secretName" . }}, key: SPRING_DATASOURCE_USERNAME }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "leads-api.secretName" . }}, key: SPRING_DATASOURCE_PASSWORD }
            - name: DATABASES
              value: {{ join " " $dbs | quote }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              i=0
              until pg_isready -q; do
                i=$((i+1))
                [ "$i" -lt 60 ] || { echo "PostgreSQL $PGHOST:$PGPORT not reachable (NetworkPolicy of its namespace?)" >&2; exit 1; }
                sleep 5
              done
              for db in $DATABASES; do
                if [ "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'")" = "1" ]; then
                  echo "database $db exists"
                else
                  psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$db\""
                  echo "database $db created"
                fi
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "leads-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "leads-api.fullname" . }}-config
            - secretRef:
                name: {{ include "leads-api.secretName" . }}
          env:
            {{- if .Values.javaOpts }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaOpts | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
