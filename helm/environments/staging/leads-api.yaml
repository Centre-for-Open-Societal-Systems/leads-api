# Values for the leads-api chart (helm/leads-api) on the QA cluster (qa.oanstaging.com), the
# staging environment: release `leads-api`, namespace `leads`, installed by the Jenkins stage
# 'Deploy (Helm → leads namespace)' on builds of the `staging` branch
# (ci/deploy-leads-helm.sh with LEADS_ENV=staging, kubeconfig oan-qa-kubeconfig =
# jenkins-qa-deployer, oan-helm environments/qa/values/oan-cluster-access.yaml). No secrets here.
#
# Set at install, not here: image (oan/leads-api:staging-ati-<build>, the image this build
# pushed, ci/resolve-leads-images.sh) and telephony.enabled (off on staging, see below).
#
# Needs on QA (cluster admin, oan-helm): `leads` in frappe-common.allowFrom of
# environments/qa/values/oan-namespace-guard.yaml, so leads-api reaches the shared PostgreSQL.

config:
  # leads_db on the shared frappe-common PostgreSQL of the QA cluster (created by dbInit below).
  SPRING_DATASOURCE_URL: jdbc:postgresql://oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local:5432/leads_db
  # No Elasticsearch on QA yet: a placeholder host, as on dev, so the app starts (search and
  # indexing calls fail until a real host is set).
  ELASTICSEARCH_HOST: elasticsearch-pending

secrets:
  values:
    SPRING_DATASOURCE_USERNAME: postgres
    # Placeholders matching the placeholder host above; not real credentials.
    ELASTICSEARCH_USERNAME: elastic
    ELASTICSEARCH_PASSWORD: pending
  # Read at install time from the shared database's own Secret (jenkins-qa-deployer may get it,
  # oan-helm environments/qa/values/oan-frappe-common.yaml), so no one keeps a copy.
  datasourcePasswordFrom:
    namespace: frappe-common
    name: oan-frappe-common-db
    key: password

# A new cluster: create leads_db on the shared PostgreSQL if it is missing.
dbInit:
  enabled: true
  host: oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local
  databases: [leads_db]

# No pull secret on QA: the node pulls from ECR with its IAM role (kubelet
# ecr-credential-provider), as a2c and grievance do there.
ecrPullSecret:
  enabled: false

# Telephony stays off on staging (the Jenkinsfile installs it only from dev): FreeSWITCH needs
# the node's network (hostNetwork), which Pod Security `baseline` of namespace leads on QA
# refuses, and the SIP trunk (Twilio) points at the dev node. To turn it on later: leads
# podSecurity privileged in oan-helm QA namespace-guard, the QA node's SG open to the trunk on
# 5060 + RTP, a trunk origination URI to the QA IP, and a telephony block like the dev one here.
telephony:
  enabled: false
  imagePullSecrets: []

# Small footprint on the shared QA node, like dev.
replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi
podDisruptionBudget:
  enabled: false
redis:
  resources:
    requests: { memory: 32Mi, cpu: 5m }
    limits: { memory: 128Mi, cpu: 200m }
