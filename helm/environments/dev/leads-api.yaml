# Values for the leads-api chart (helm/leads-api) on the dev cluster: release `leads-api`,
# namespace `leads`. No secrets in this file. ci/deploy-leads-helm.sh passes it first, then,
# only if it exists, the Jenkins secret-file credential LEADS_VALUES_CRED (default
# dev-leads-secret-values; template helm/leads-api/ci/deploy-values.example.yaml), which
# overrides anything here.
#
# Image tags/digests and telephony.enabled come from the Jenkins job, not from this file.

config:
  # leads_db on the shared frappe-common PostgreSQL of this cluster.
  SPRING_DATASOURCE_URL: jdbc:postgresql://oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local:5432/leads_db
  # No Elasticsearch on this cluster yet: a placeholder host, so the app starts (search and
  # indexing calls fail until a real host is set here or in the Jenkins credential).
  ELASTICSEARCH_HOST: elasticsearch-pending

secrets:
  values:
    SPRING_DATASOURCE_USERNAME: postgres
    # Placeholders matching the placeholder host above; not real credentials.
    ELASTICSEARCH_USERNAME: elastic
    ELASTICSEARCH_PASSWORD: pending
  # The PostgreSQL password is read at install time from the shared database's own Secret
  # (the deployer, jenkins-a2c-deployer, has `get` on exactly this Secret: oan-helm
  # oan-cluster-access readSecret), so no one keeps a copy of it.
  datasourcePasswordFrom:
    namespace: frappe-common
    name: oan-frappe-common-db
    key: password

# Redis: the in-chart cache (chart default).

telephony:
  leadService:
    # lead_db on the same shared PostgreSQL (used only when the job runs with TELEPHONY).
    dbUrl: jdbc:postgresql://oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local:5432/lead_db
