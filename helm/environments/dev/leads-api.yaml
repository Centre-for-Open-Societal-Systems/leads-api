# Values for the leads-api chart (helm/leads-api) on the dev cluster: release `leads-api`,
# namespace `leads`. No secrets in this file. ci/deploy-leads-helm.sh passes it first, then,
# only if it exists, the Jenkins secret-file credential LEADS_VALUES_CRED (default
# dev-leads-secret-values; template helm/leads-api/ci/deploy-values.example.yaml), which
# overrides anything here.
#
# Image tags/digests and telephony.enabled come from the Jenkins job, not from this file.

config:
  # leads_db on the shared frappe-common PostgreSQL of this cluster.
  SPRING_DATASOURCE_URL: jdbc:postgresql://oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local:5432/leads_db
  # No Elasticsearch on this cluster yet: a placeholder host, so the app starts (search and
  # indexing calls fail until a real host is set here or in the Jenkins credential).
  ELASTICSEARCH_HOST: elasticsearch-pending

secrets:
  values:
    SPRING_DATASOURCE_USERNAME: postgres
    # Placeholders matching the placeholder host above; not real credentials.
    ELASTICSEARCH_USERNAME: elastic
    ELASTICSEARCH_PASSWORD: pending
  # The PostgreSQL password is read at install time from the shared database's own Secret
  # (the deployer, jenkins-a2c-deployer, has `get` on exactly this Secret: oan-helm
  # oan-cluster-access readSecret), so no one keeps a copy of it.
  datasourcePasswordFrom:
    namespace: frappe-common
    name: oan-frappe-common-db
    key: password

# Redis: the in-chart cache (chart default).

telephony:
  # Chart-owned Secret, no copy kept anywhere: DB_PASSWORD read at install time from the
  # same shared-database Secret as above, ESL_PASSWORD generated once and kept on upgrades.
  secret:
    create: true
    values:
      DB_USER: postgres
    dbPasswordFrom:
      namespace: frappe-common
      name: oan-frappe-common-db
      key: password
    generateEslPassword: true
  leadService:
    # lead_db on the same shared PostgreSQL (used only when the job runs with TELEPHONY).
    dbUrl: jdbc:postgresql://oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local:5432/lead_db
  freeswitch:
    # FreeSWITCH uses the node's network (SIP 5060 UDP/TCP, RTP UDP 16384-32768): pinned to the
    # leads node, EC2 `services-development` (i-09ad0ea954f499105, 10.0.1.131).
    nodeSelector:
      kubernetes.io/hostname: ip-10-0-1-131
    # Public IP of that node, the address the SIP trunk sends calls to. Not an Elastic IP: it
    # changes if the instance is stopped and started, and this value with it.
    extIp: 13.234.239.132
    # The SIP trunk's signalling ranges (Twilio Elastic SIP Trunking), the same list the old
    # Tokyo proxy allows on 5060 (security group Freeswitch-EC2-proxy-sg). Calls from anywhere
    # else are refused.
    sipTrunkCidrs:
    - 54.172.60.0/30
    - 54.244.51.0/30
    - 54.171.127.192/30
    - 35.156.191.128/30
    - 54.65.63.192/30
    - 54.169.127.128/30
    - 54.252.254.64/30
    - 177.71.206.192/30

# Small dev footprint, like the old release on this cluster (oan-leads-api: 40m API, 5m redis):
# the leads node is short on CPU, and the chart defaults (2 x 250m + 100m redis) left pods
# Pending with "Insufficient cpu". Requests only; the limits stay, so the JVM can still burst.
replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi
# One replica: a minAvailable 1 budget would block node drains.
podDisruptionBudget:
  enabled: false
redis:
  resources:
    requests: { memory: 32Mi, cpu: 5m }
    limits: { memory: 128Mi, cpu: 200m }
